version: 2
updates:
  - package-ecosystem: pip
    directory: /agent
    schedule:
      interval: monthly
    groups:
      agent-python:
        patterns: ["*"]
    commit-message:
      prefix: "chore(deps)"
    open-pull-requests-limit: 2

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      github-actions:
        patterns: ["*"]
    commit-message:
      prefix: "chore(deps)"
    open-pull-requests-limit: 2

  - package-ecosystem: npm
    directory: /backend
    schedule:
      interval: monthly
    groups:
      backend-npm:
        patterns: ["*"]
    commit-message:
      prefix: "chore(deps)"
    open-pull-requests-limit: 2

  - package-ecosystem: pub
    directory: /mobile
    schedule:
      interval: monthly
    groups:
      mobile-pub:
        patterns: ["*"]
    commit-message:
      prefix: "chore(deps)"
    open-pull-requests-limit: 2

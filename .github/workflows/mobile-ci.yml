name: Mobile CI

on:
  pull_request:
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-ci.yml'
      - '.github/workflows/firebase-hosting-merge.yml'
      - '.github/workflows/deploy-appetize.yml'

permissions:
  contents: read

concurrency:
  group: mobile-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Analyze, test and build web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: mobile/.fvmrc
          channel: stable
          cache: true

      - run: sed 's#YOUR_[A-Z_]*_URL#https://example.invalid#' lib/config.example.dart > lib/config.dart
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - run: flutter test
      - run: flutter build web --release

  android:
    name: Build APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: mobile/.fvmrc
          channel: stable
          cache: true

      - run: sed 's#YOUR_[A-Z_]*_URL#https://example.invalid#' lib/config.example.dart > lib/config.dart
      - name: Placeholder google-services.json
        run: |
          cat > android/app/google-services.json <<'JSON'
          {
            "project_info": {"project_number": "000000000000", "project_id": "ci-placeholder", "storage_bucket": "ci-placeholder.appspot.com"},
            "client": [{
              "client_info": {"mobilesdk_app_id": "1:000000000000:android:0000000000000000", "android_client_info": {"package_name": "com.star.favorite_places"}},
              "oauth_client": [],
              "api_key": [{"current_key": "ci-placeholder"}],
              "services": {"appinvite_service": {"other_platform_oauth_client": []}}
            }],
            "configuration_version": "1"
          }
          JSON
      - run: flutter pub get
      - run: flutter build apk --release

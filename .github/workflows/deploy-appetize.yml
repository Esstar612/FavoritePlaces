name: Deploy to Appetize

on:
  push:
    branches: [ main ]
    paths:
      - 'mobile/**'

jobs:
  deploy-appetize:
    name: Build and Deploy to Appetize.io
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
      
      - name: ☕ Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      
      - name: 🐦 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.9'
          channel: 'stable'
          cache: true
      
      - name: 🔧 Create config.dart
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
          GOOGLE_MAPS_API_KEY_WEB: ${{ secrets.GOOGLE_MAPS_API_KEY_WEB }}
          BACKEND_URL: ${{ secrets.BACKEND_URL }}
        run: |
          cat > mobile/lib/config.dart <<EOF
          import 'package:flutter/foundation.dart' show kIsWeb;

          class AppConfig {
            // Web is referrer-restricted to the hosting domain; mobile REST
            // calls carry no restrictable identity so that key is limited by
            // API and quota. Neither can geocode — the backend does that.
            static const String _webMapsKey = '$GOOGLE_MAPS_API_KEY_WEB';
            static const String _mobileMapsKey = '$GOOGLE_MAPS_API_KEY';

            static String get googleMapsApiKey =>
                kIsWeb ? _webMapsKey : _mobileMapsKey;

            static const String backendUrl = '$BACKEND_URL';

            static const String appName = 'Favorite Places';
            static const String placesCollection = 'places';
            static const String usersCollection = 'users';
          }
          EOF

      - name: 🔧 Create google-services.json
        run: |
          echo "${{ secrets.GOOGLE_SERVICES_JSON }}" | base64 --decode > mobile/android/app/google-services.json
      
      - name: 📦 Install dependencies
        run: |
          cd mobile
          flutter pub get
      
      - name: 🔨 Build APK
        run: |
          cd mobile
          flutter build apk --release
      
      - name: 📤 Upload to Appetize.io
        env:
          APPETIZE_TOKEN: ${{ secrets.APPETIZE_API_TOKEN }}
          APPETIZE_KEY: ${{ secrets.APPETIZE_PUBLIC_KEY }}
        run: |
          curl -X POST https://api.appetize.io/v1/apps/$APPETIZE_KEY \
            -F file=@mobile/build/app/outputs/flutter-apk/app-release.apk \
            -u $APPETIZE_TOKEN:
      
      - name: ✅ Success
        run: |
          echo "🎉 APK successfully uploaded to Appetize!"
          echo "📱 Your app is live at: https://appetize.io/app/${{ secrets.APPETIZE_PUBLIC_KEY }}"
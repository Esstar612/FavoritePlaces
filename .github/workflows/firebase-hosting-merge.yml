name: Deploy web to Firebase Hosting

on:
  push:
    branches: [ main ]
    paths:
      - 'mobile/**'
      - '.github/workflows/firebase-hosting-merge.yml'

jobs:
  build_and_deploy:
    name: Build Flutter web and deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v7

      - name: 🐦 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.9'
          channel: 'stable'
          cache: true

      # config.dart is gitignored, so CI has to write it. No dart:io import —
      # that would break the web build, where dart:io is unavailable.
      - name: 🔧 Create config.dart
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
          GOOGLE_MAPS_API_KEY_WEB: ${{ secrets.GOOGLE_MAPS_API_KEY_WEB }}
          BACKEND_URL: ${{ secrets.BACKEND_URL }}
        run: |
          cat > mobile/lib/config.dart <<EOF
          import 'package:flutter/foundation.dart' show kIsWeb;

          class AppConfig {
            // Web is referrer-restricted to the hosting domain; mobile REST
            // calls carry no restrictable identity so that key is limited by
            // API and quota. Neither can geocode — the backend does that.
            static const String _webMapsKey = '$GOOGLE_MAPS_API_KEY_WEB';
            static const String _mobileMapsKey = '$GOOGLE_MAPS_API_KEY';

            static String get googleMapsApiKey =>
                kIsWeb ? _webMapsKey : _mobileMapsKey;

            static const String backendUrl = '$BACKEND_URL';
            static const String agentUrl = 'https://favorite-places-agent-671529202846.us-central1.run.app';

            static const String appName = 'Favorite Places';
            static const String placesCollection = 'places';
            static const String usersCollection = 'users';
          }
          EOF

      - name: 📦 Install dependencies
        run: cd mobile && flutter pub get

      # Catches a broken build before it reaches the live demo URL.
      - name: 🔍 Analyze
        run: cd mobile && flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: 🧪 Test
        run: cd mobile && flutter test

      - name: 🔨 Build web
        run: cd mobile && flutter build web --release

      - name: 🔑 Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_HOSTING_DEPLOYER_SA }}

      - name: 🚀 Deploy to Firebase Hosting
        run: npx --yes firebase-tools@15.32.0 deploy --only hosting --project favorite-places-app-94adb --non-interactive

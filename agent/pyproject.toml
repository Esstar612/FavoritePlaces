[project]
name = "outing-agent"
version = "0.1.0"
description = "Recommends outings from a user's saved Favorite Places using tool calling."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.141.1,<0.142",
    "uvicorn[standard]>=0.53.0,<0.54",
    "pydantic>=2.13.5,<3",
    "langgraph>=1.2.12,<2",
    "langchain-core>=1.6.5,<2",
    "langchain-anthropic>=1.7.4,<2",
    "langchain-openai>=1.6.6,<2",
    "langsmith>=0.14.0,<0.15",
    "python-dotenv>=1.2.3,<2",
    "httpx>=0.28.1,<0.29",
    "firebase-admin>=7.7.0,<8",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1,<10",
    "ruff>=0.16.9,<0.17",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/outing_agent"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends"]

[tool.pytest.ini_options]
testpaths = ["tests"]

name: favorite_places
description: "Flutter places app with Firebase Auth, Firestore, cloud sync, and AI features."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  uuid: ^4.5.1
  flutter_riverpod: ^3.4.3
  image_picker: ^1.1.2
  location: ^10.0.2
  http: ^1.3.0
  google_maps_flutter: ^2.12.1
  firebase_core: ^4.15.0
  firebase_auth: ^6.7.0
  cloud_firestore: ^6.10.0
  firebase_storage: ^13.6.0
  google_sign_in: ^7.2.0
  # imported directly by lib/utils/maps_loader_web.dart
  web: ^1.1.0
  url_launcher: ^6.3.2
  flutter_svg: ^2.3.0
  pointer_interceptor: ^0.10.1+3

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  fake_cloud_firestore: ^4.3.0

flutter:
  uses-material-design: true
  assets:
    - assets/google_g.svg
  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
        - asset: assets/fonts/Roboto-Italic.ttf
          style: italic
        - asset: assets/fonts/Roboto-Medium.ttf
          weight: 500
        - asset: assets/fonts/Roboto-Bold.ttf
          weight: 700
